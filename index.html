<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phase 10 Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="appContainer">
        
        <section id="authScreen" class="screen active">
            <div class="glass-card center-box">
                <h1 class="title">👑 Phase 10</h1>
                <div id="loginForm">
                    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" dir="ltr">
                    <input type="password" id="loginPass" placeholder="كلمة المرور" dir="ltr">
                    <button id="btnLogin" class="btn-primary">دخول</button>
                    <p class="hint-text" onclick="toggleAuthMode('register')">ليس لديك حساب؟ <span>سجل جديد</span></p>
                </div>
                <div id="registerForm" style="display:none;">
                    <input type="text" id="regName" placeholder="الاسم (اللقب)">
                    <div class="avatar-scroll" id="avatarList"></div>
                    <input type="hidden" id="selectedAvatar" value="🦁">
                    <input type="email" id="regEmail" placeholder="البريد الإلكتروني" dir="ltr">
                    <input type="password" id="regPass" placeholder="كلمة المرور" dir="ltr">
                    <button id="btnRegister" class="btn-success">إنشاء حساب</button>
                    <p class="hint-text" onclick="toggleAuthMode('login')">لديك حساب؟ <span>دخول</span></p>
                </div>
            </div>
        </section>

        <section id="lobbyScreen" class="screen">
            <header class="top-bar">
                <div class="profile-badge" onclick="editMyProfile()">
                    <span id="myAvatar">😎</span> <span id="myName">...</span> <span style="font-size:10px">✏️</span>
                </div>
                <div style="display:flex; gap:10px;">
                    <button onclick="openFameModal()" class="btn-icon gold-border">🏆</button>
                    <button id="adminSettingsBtn" onclick="openAdminModal()" class="btn-icon" style="display:none;">⚙️</button>
                    <button id="btnLogout" class="btn-icon">🚪</button>
                </div>
            </header>

            <div class="glass-card">
                <h2 style="color:var(--gold)">غرفة الانتظار 🛋️</h2>
                
                <div id="returnToGamePanel" style="display:none; margin-bottom:15px;">
                    <button onclick="showScreen('gameScreen')" class="btn-glass gold-border full-width pulse-anim">↩️ العودة للمباراة الجارية</button>
                </div>

                <div id="adminQuickControls" class="admin-panel" style="display:none;">
                    <button id="mainGameBtn" onclick="handleGameBtn()" class="btn-success">⚽ بدء المباراة</button>
                    <p style="font-size:12px; color:#aaa; margin-top:5px; text-align:center;">حدد اللاعبين للدخول 👇</p>
                </div>
                
                <div class="player-list-container">
                    <div id="lobbyPlayersList" class="grid-list"></div>
                </div>
            </div>
        </section>

        <section id="gameScreen" class="screen">
            <header class="game-header">
                <div class="round-control">
                    <button id="btnPrevRound" class="nav-btn" style="display:none;">❮</button>
                    <div class="round-info"><span>الجولة</span><span id="currentRoundDisplay">1</span></div>
                    <button id="btnNextRound" class="nav-btn" style="display:none;">❯</button>
                </div>
                <div class="header-actions">
                    <button onclick="goToLobby()" class="btn-glass warning">🏠</button>
                </div>
            </header>

            <div class="glass-panel" style="margin-bottom:15px; display:flex; gap:5px;">
                <button onclick="openTableModal()" class="btn-glass" style="flex:1">📊 الترتيب</button>
                <button onclick="randomSkip()" class="btn-glass" style="flex:1; border-color:var(--danger); color:var(--danger)">🎲 سكيب عشوائي</button>
            </div>

            <div id="roundPhaseDesc" class="phase-desc">-- المطلوب --</div>
            <div id="gamePlayersContainer" class="cards-container"></div>
            
            <div id="adminEndGamePanel" style="margin-top:20px; display:none;">
                <button onclick="finishGameAndArchive()" class="btn-danger-outline full-width">💾 إنهاء المباراة وحفظ الألقاب</button>
            </div>
        </section>

    </div>

    <div id="fullTableModal" class="modal">
        <div class="modal-content table-modal">
            <div class="modal-header"><h3>📊 الجدول الكامل</h3><button onclick="document.getElementById('fullTableModal').style.display='none'" class="close-btn">✕</button></div>
            <div class="table-scroll"><table id="scoreTable"><thead><tr></tr></thead><tbody id="tableBody"></tbody></table></div>
        </div>
    </div>

    <div id="fameModal" class="modal">
        <div class="modal-content table-modal">
            <div class="modal-header"><h3 style="color:var(--gold)">🏆 لوحة الشرف</h3><button onclick="document.getElementById('fameModal').style.display='none'" class="close-btn">✕</button></div>
            <div id="fameList" class="grid-list"></div>
        </div>
    </div>

    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>⚙️ إعدادات الإدارة</h3><button onclick="document.getElementById('adminModal').style.display='none'" class="close-btn">✕</button></div>
            <div class="settings-list">
                <button onclick="openTransferAdmin()" class="btn-glass">🔑 نقل الأدمن</button>
                <button onclick="openManagePlayers()" class="btn-glass">👥 إدارة اللاعبين (حذف/تعديل)</button>
                <hr style="border-color:#333; margin:10px 0;">
                <button onclick="resetGameCompletely()" class="btn-danger-outline">☢️ تصفير المصنع (مسح كل شيء)</button>
            </div>
        </div>
    </div>

    <div id="subModal" class="modal">
        <div class="modal-content">
            <h3>🔄 تبديل لاعب</h3>
            <div id="subCandidatesList" class="grid-list"></div>
            <button onclick="document.getElementById('subModal').style.display='none'" class="btn-glass full-width">إلغاء</button>
        </div>
    </div>

    <div id="skipModal" class="modal center-modal">
        <div class="modal-content text-center">
            <div style="font-size:60px">🤡</div>
            <h2 id="skipTargetName" style="color:var(--danger)"></h2>
            <p id="skipComment" style="font-size:18px; color:#aaa;"></p>
            <button onclick="document.getElementById('skipModal').style.display='none'" class="btn-primary full-width">حبيبي ولا يهمك 😂</button>
        </div>
    </div>

    <div id="transferAdminModal" class="modal">
        <div class="modal-content">
            <h3>🔑 اختر الأدمن الجديد</h3>
            <div id="adminCandidatesList" class="grid-list"></div>
            <button onclick="document.getElementById('transferAdminModal').style.display='none'" class="btn-glass full-width">إلغاء</button>
        </div>
    </div>

    <div id="managePlayersModal" class="modal">
        <div class="modal-content">
            <h3>👥 حذف/تعديل اللاعبين</h3>
            <div id="manageList" class="grid-list"></div>
            <button onclick="document.getElementById('managePlayersModal').style.display='none'" class="btn-glass full-width">إغلاق</button>
        </div>
    </div>

    <audio id="soundLion" src="https://www.myinstants.com/media/sounds/lion-roar.mp3"></audio>
    <audio id="soundSheep" src="https://www.myinstants.com/media/sounds/goat-scream.mp3"></audio>
    <audio id="soundSkip" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
<div id="certModal" class="modal center-modal" style="z-index: 3000;">
        <div id="certCard" class="cert-card">
            <div class="cert-header">
                <span id="certIcon" style="font-size:50px;">🦁</span>
                <h2 id="certTitle">شهادة الأسد</h2>
            </div>
            <div class="cert-body">
                <p id="certText" class="cert-text"></p>
                <div class="cert-witnesses">
                    <span>على رقاب كل من:</span>
                    <p id="certList" style="color:#aaa; font-size:12px; margin-top:5px;"></p>
                </div>
                <div class="cert-date" id="certDate"></div>
            </div>
            <div class="cert-footer">
                <button id="nextCertBtn" class="btn-primary full-width">عرض شهادة الخروف 🐑</button>
                <button id="closeCertBtn" onclick="closeCert()" class="btn-glass full-width" style="display:none; margin-top:10px;">إغلاق</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
